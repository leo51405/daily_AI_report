<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 日報 · 歷史日報</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f2; --card: #ffffff; --text: #18181b; --muted: #6b6b73;
    --line: #e5e2db; --accent: #e5484d; --accent-soft: #fdecec; --thumb-l: 88%;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111113; --card: #1b1b1f; --text: #ededf0; --muted: #9a9aa3;
      --line: #2c2c33; --accent: #ff6369; --accent-soft: #3a1c1e; --thumb-l: 26%;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.7 "Noto Sans TC", system-ui, sans-serif;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 64px; }
  header.top {
    display: flex; justify-content: space-between; align-items: center;
    padding: 20px 0; border-bottom: 1px solid var(--line);
  }
  .brand { font: 900 24px/1 "Noto Serif TC", serif; letter-spacing: .04em; }
  .brand span { color: var(--accent); }
  nav.top a { color: var(--muted); font-size: 14px; margin-left: 20px; }
  nav.top a:hover { color: var(--accent); }
  .section-title {
    display: flex; align-items: center; gap: 10px;
    font-size: 15px; font-weight: 700; letter-spacing: .08em; margin: 44px 0 16px;
  }
  .section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* 縮圖：底層是依來源配色的替代圖，圖片載入失敗時移除 img 即露出 */
  .thumb {
    position: relative; overflow: hidden; border-radius: 10px; aspect-ratio: 16 / 9;
    background: hsl(var(--hue) 45% var(--thumb-l));
    display: flex; align-items: center; justify-content: center;
  }
  .thumb .fallback { font: 900 clamp(16px, 2.4vw, 26px)/1.2 "Noto Serif TC", serif; color: hsl(var(--hue) 40% 45%); padding: 0 12px; text-align: center; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .3s; }
  a:hover .thumb img { transform: scale(1.03); }

  footer { color: var(--muted); font-size: 13px; text-align: center; margin-top: 56px; }
</style>

<style>
  h1 { font: 900 clamp(26px, 5vw, 36px)/1.2 "Noto Serif TC", serif; margin: 28px 0 4px; }
  .meta { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  ul.days { list-style: none; padding: 0; margin: 0; }
  ul.days li { border-bottom: 1px solid var(--line); }
  ul.days a { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 18px; align-items: center; padding: 16px 0; }
  ul.days a:hover .date { color: var(--accent); }
  .date { font: 700 20px/1.4 "Noto Serif TC", serif; }
  .count { color: var(--muted); font-size: 13px; margin-left: 8px; }
  .headline { display: block; color: var(--muted); font-size: 15px; margin-top: 2px; }
  @media (max-width: 560px) { ul.days a { grid-template-columns: 110px minmax(0, 1fr); gap: 12px; } }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="index.html">AI <span>日報</span></a>
    <nav class="top"><a href="index.html">最新</a><a href="archive.html">歷史日報</a></nav>
  </header>
  
<h1>歷史日報</h1>
<div class="meta">共 1 天</div>
<ul class="days">
  
  
  <li><a href="2026-10-27.html">
    
<div class="thumb" style="--hue: 134">
  <span class="fallback">iThome</span>
  <img src="https://www.ithome.com.tw/sites/default/files/field/image/0529-anthropic-cash-photo_by_logan_voss_on_unsplash_0.jpg" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">
</div>

    <div>
      <span class="date">2026-10-27 星期二</span><span class="count">16 則</span>
      <span class="headline">Anthropic 遞交 IPO 申請：第二季營收 116 億美元，擬以 ANT 在那斯達克上市</span>
    </div>
  </a></li>
  
</ul>

  <footer>每日台灣時間早上自動彙整 · 摘要由 AI 產生，細節請以原文為準</footer>
</div>
</body>
</html>
