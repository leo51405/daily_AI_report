name: Daily AI Report

on:
  schedule:
    # GitHub 排程在整點/半點易延遲或漏跑，故錯開分鐘並加備援
    - cron: "17 22 * * *"  # 台灣 06:17 主排程
    - cron: "47 23 * * *"  # 台灣 07:47 備援（當日已有報告則跳過）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          if [ "${{ github.event_name }}" = schedule ] && [ -f "data/$(TZ=Asia/Taipei date +%F).json" ]; then
            echo "今日報告已存在，跳過"; exit 0
          fi
          python main.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git commit -m "Daily report $(TZ=Asia/Taipei date +%F)" || echo "No changes"
          git push
