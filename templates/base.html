<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AI 日報{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0; --card: #ffffff; --text: #1d1d1f; --muted: #6b6b70;
    --line: #e4e0d8; --accent: #c2410c; --why-bg: #fff4ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416; --card: #1d1d20; --text: #ececee; --muted: #9b9ba3;
      --line: #2e2e33; --accent: #fb923c; --why-bg: #2a1f17;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.75 "Noto Sans TC", system-ui, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 64px; }
  a { color: inherit; }
  header.top {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 28px 0 12px; border-bottom: 3px double var(--line);
  }
  .brand { font: 900 22px/1 "Noto Serif TC", serif; text-decoration: none; letter-spacing: .04em; }
  .brand span { color: var(--accent); }
  nav.top a { color: var(--muted); text-decoration: none; font-size: 14px; margin-left: 16px; }
  nav.top a:hover { color: var(--accent); }
  h1 { font: 900 clamp(28px, 6vw, 40px)/1.2 "Noto Serif TC", serif; margin: 32px 0 4px; }
  .meta { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
  footer { color: var(--muted); font-size: 13px; text-align: center; margin-top: 48px; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="index.html">AI <span>日報</span></a>
    <nav class="top"><a href="index.html">最新</a><a href="archive.html">歷史日報</a></nav>
  </header>
  {% block content %}{% endblock %}
  <footer>每日台灣時間早上自動彙整 · 摘要由 AI 產生，細節請以原文為準</footer>
</div>
</body>
</html>
